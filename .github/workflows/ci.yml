# 常规校验：每次 push / PR 只做类型检查、测试与构建，永远不创建 GitHub Release。
# 发布走 .github/workflows/release.yml（需显式指定版本才会出 Release）。
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 类型检查与测试
    runs-on: ubuntu-latest
    env:
      # 契约断言的是中文产品文案（参数拒绝指引、错误提示等）。这些文案随界面
      # 语言切换：i18n core 按 navigator.language 判定 zh* → zh-CN，其余 → en。
      # runner 的界面语言是 en-US，于是云端拿到英文文案而失败——把测试进程的
      # 界面语言钉到 zh-CN，与作者本机口径一致（见 tests/locale-pin.mjs）。
      NODE_OPTIONS: --import=./tests/locale-pin.mjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare WXT types
        run: npx wxt prepare
      - name: Type check
        run: npm run compile
      - name: Test
        run: npm run test:all

  build:
    name: 构建 ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            target: chrome
          - browser: firefox
            target: firefox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          BROWSER_UUID: ${{ vars.BROWSER_UUID }}
        run: npx wxt build -b ${{ matrix.target }}
