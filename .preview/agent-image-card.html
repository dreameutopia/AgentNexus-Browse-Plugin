<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>回答内截图卡片与看图层预览</title>
<link rel="stylesheet" href="../entrypoints/sidepanel/styles/global.css">
<link rel="stylesheet" href="../entrypoints/sidepanel/styles/app.css">
<style>
  /* 预览页仅用于视觉核对：复刻侧边栏列宽（380px） */
  body { margin: 0; padding: 24px; background: var(--bg-secondary, #f8fafc); }
  .preview-row { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .preview-col { background: var(--bg-primary, #fff); border: 1px solid var(--line-soft, #e4e2de); border-radius: 12px; padding: 12px; }
  .preview-col--narrow { width: 380px; }
  .preview-label { font-size: 11px; color: var(--ink-secondary, #787671); margin-bottom: 8px; }
  /* 预览页专用：真实实现是 fixed 覆盖整个侧边栏，这里收进展示框内便于并排核对 */
  .preview-stage { position: relative; width: 380px; height: 460px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line-soft, #e4e2de); }
  .preview-stage .image-viewer { position: absolute; }
/* ==================== 回答内截图引用（<agent-image id="..." />） ====================
   结构契约见 markdown-renderer.buildAgentImageCard / agent-image-renderer.ts：
   .agent-image-card[data-agent-image-id][data-agent-image-state]
     └─ .agent-image-body（占位文本 → 异步注入 <img>）
   状态机：pending → loading → done | missing | error。
   图片本体来自图片库（与 vision loop 自动截图同一处存储），按短 id 反查。

   卡片只展示图片本身：短 id 是存储层凭据，不在底部重复展示（用户明确要求）；
   画面说明（alt）移到图片的 title 悬浮提示上，信息不丢。点击图片在侧边栏内
   打开共享看图层 ImageViewer（遮罩 + 缩放 / 打开 / 下载）。 */

.agent-image-card {
  margin: 12px 0;
  border: 1px solid var(--line-soft, #e4e2de);
  border-radius: 8px;
  overflow: hidden;
  background: #ffffff;
}

.agent-image-card .agent-image-body {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 8px;
}

.agent-image-card .agent-image-body img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 4px;
  background: var(--surface-soft, #f3f1ed);
  cursor: zoom-in;
}

.agent-image-card .agent-image-placeholder,
.agent-image-card .agent-image-missing {
  display: block;
  padding: 18px 12px;
  text-align: center;
  font-size: 12px;
  color: #8b949e;
}

.agent-image-card .agent-image-missing {
  color: #b3564e;
}


/* ==================== 共享全屏看图层（ImageViewer） ====================
   Teleport 到 body 的模态层样式；根命名空间 .image-viewer，
   与消息流样式互相隔离（消息内联部件 / 底部图片区 / 回答内截图共用本层）。

   尺寸约定：侧边栏是窄列（~380px），工具条按「缩小 / 放大 / 在网页中打开 /
   下载」四键排布，允许换行但不超过视口宽度，绝不横向溢出。 */

.image-viewer {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(2, 6, 23, 0.88);
}

.viewer-stage {
  display: flex;
  /* 交叉轴顶对齐：放大后图片可能高于舞台，flex 居中会让顶部溢出且滚不回去 */
  align-items: flex-start;
  justify-content: flex-start;
  max-width: calc(100vw - 96px);
  max-height: calc(100vh - 120px);
  margin: 0;
  overflow: auto;
  cursor: zoom-in;
}

/* 图片用 margin:auto 居中（而非 justify-content:center）：
   flex 居中在内容溢出时会把左侧裁掉且滚不回去，margin:auto 不会。 */
.viewer-img {
  display: block;
  margin: auto;
  max-width: 100%;
  max-height: calc(100vh - 120px);
  object-fit: contain;
  border-radius: 6px;
  box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
}

/* 放大态：宽高由组件按原始像素 × 档位显式给出，这里解除尺寸约束 */
.viewer-img.zoomed {
  max-width: none;
  max-height: none;
  width: auto;
  height: auto;
  cursor: zoom-out;
}

.viewer-unavailable {
  color: #94a3b8;
  font-size: 14px;
}

/* 关闭按钮（右上角） */
.viewer-close {
  position: absolute;
  top: 16px;
  right: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: rgba(148, 163, 184, 0.2);
  color: #e2e8f0;
  cursor: pointer;
  transition: background 0.15s ease;
}

.viewer-close:hover {
  background: rgba(148, 163, 184, 0.4);
}

/* 前后翻页 */
.viewer-nav {
  position: absolute;
  top: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: rgba(148, 163, 184, 0.2);
  color: #e2e8f0;
  cursor: pointer;
  transform: translateY(-50%);
  transition: background 0.15s ease;
}

.viewer-nav:hover {
  background: rgba(148, 163, 184, 0.4);
}

.viewer-nav.prev {
  left: 16px;
}

.viewer-nav.next {
  right: 16px;
}

/* 底部工具条（计数 / 缩小 / 放大 / 在网页中打开 / 下载） */
.viewer-toolbar {
  position: absolute;
  bottom: 16px;
  left: 50%;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  max-width: calc(100vw - 24px);
  padding: 8px 14px;
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.85);
  border: 1px solid rgba(148, 163, 184, 0.25);
  color: #e2e8f0;
  transform: translateX(-50%);
}

.viewer-counter {
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  color: #94a3b8;
}

.viewer-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 12px;
  border: 1px solid rgba(148, 163, 184, 0.35);
  border-radius: 999px;
  background: rgba(148, 163, 184, 0.15);
  color: inherit;
  font-size: 12px;
  line-height: 1.5;
  white-space: nowrap;
  cursor: pointer;
  transition: background 0.15s ease;
}

.viewer-btn:hover:not(:disabled) {
  background: rgba(148, 163, 184, 0.32);
}

.viewer-btn:disabled {
  opacity: 0.45;
  cursor: default;
}

</style>
</head>
