<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>工具审批弹窗文案分档预览</title>
    <!-- 生产弹窗样式：与 AppDialog.vue 同一份 app-dialog.css -->
    <link rel="stylesheet" href="../entrypoints/sidepanel/components/feedback/app-dialog.css" />
    <style>
      /* app-container 的 token 快照（app.css 同口径），让 var() 与真实应用一致 */
      body {
        --surface-canvas: #faf9f7;
        --surface-card: #ffffff;
        --surface-soft: #f3f1ed;
        --surface-hover: #eeece7;
        --line-soft: #e4e2de;
        --ink-primary: #292824;
        --ink-secondary: #787671;
        --ink-muted: #9b9790;
        margin: 0;
        padding: 24px;
        background: #f4f5f7;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: var(--ink-primary);
      }
      .stage {
        background: var(--surface-canvas);
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 16px;
        width: 380px;
        margin: 0 auto;
      }
      .stage-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
      .stage-header h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0;
        color: var(--ink-primary);
      }
      .stage-header button {
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--line-soft);
        background: var(--surface-card);
        color: var(--ink-secondary);
        cursor: pointer;
      }
      .hint {
        font-size: 12px;
        color: var(--ink-muted);
        line-height: 1.6;
        margin: 0 0 14px;
      }
      /* 画廊：去掉遮罩的定位居中，让各档位纵向排开便于一眼对照 */
      .preview-case {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 14px 0;
        border-top: 1px dashed var(--line-soft);
      }
      .preview-case:first-of-type {
        border-top: none;
        padding-top: 0;
      }
      .preview-case-label {
        align-self: flex-start;
        font-size: 11px;
        color: var(--ink-muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      /* 真实弹窗在页面里取消 fixed 定位（.app-dialog-overlay 才是 fixed），
         这里直接用 .app-dialog 本体，宽度/内边距/按钮全部来自生产样式 */
      .preview-case .app-dialog {
        animation: none;
        box-shadow: 0 8px 24px -12px rgba(0, 0, 0, 0.22);
      }
      .preview-case .app-dialog-message {
        max-height: none;
        overflow: visible;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="stage-header">
        <h1>工具审批弹窗 · 按命中原因分档</h1>
        <button id="locale-toggle" type="button">切换到 English</button>
      </div>
      <p class="hint">
        文案与选 key 走生产路径（approval-copy.ts + utils/i18n/core），样式来自生产的 app-dialog.css。
        重点看第 1 档：装依赖时应点名装的是哪个包，而不是「破坏性或不可逆」。
      </p>
      <div id="gallery"></div>
    </div>
    <script src="../node_modules/.cache/tool-approval-preview.js"></script>
  </body>
</html>
