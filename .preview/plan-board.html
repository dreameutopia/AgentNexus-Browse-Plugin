<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>会话计划面板预览</title>
    <link rel="stylesheet" href="../entrypoints/sidepanel/styles/global.css" />
    <link rel="stylesheet" href="../entrypoints/sidepanel/components/chat/plan-board.css" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #f4f5f7;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .stage {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 16px;
        width: 380px;
      }
      .stage h3 {
        font-size: 12px;
        color: #9ca3af;
        margin: 0 0 12px;
        font-weight: 500;
      }
      /* 模拟输入容器（面板就位于它正上方） */
      .input-container {
        display: flex;
        flex-direction: column;
        background: #f8fafc;
        border: 1px solid #e5e7eb;
        border-radius: 24px;
        padding: 12px 16px;
        gap: 8px;
      }
      .message-input {
        font-size: 14px;
        color: #9ca3af;
      }
      .bottom-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .pill {
        padding: 4px 10px;
        border-radius: 999px;
        background: #f1f5f9;
        font-size: 11.5px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <h3>折叠态（默认视图：位于输入容器正上方）</h3>
      <div class="plan-board">
        <button class="plan-board__header">
          <span class="plan-board__mark">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
              <path d="M4 5H10V11H4V5Z M4 13H10V19H4V13Z M12 6H20V8H12V6Z M12 10H20V12H12V10Z M12 16H20V18H12V16Z M12 14H20V15H12V14Z" fill="currentColor" />
            </svg>
          </span>
          <span class="plan-board__title">任务计划</span>
          <span class="plan-board__counter">2<span class="plan-board__counter-sep">/</span>5</span>
          <span class="plan-board__current">
            <span class="plan-board__current-label">进行中：</span>遍历搜索结果列表并核对覆盖范围
          </span>
          <svg class="plan-board__chevron" width="10" height="10" viewBox="0 0 24 24" fill="none">
            <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <div class="plan-board__track">
          <span class="plan-board__track-fill" style="width: 40%"></span>
        </div>
      </div>
      <div class="input-container">
        <div class="message-input">在这里输入你的问题…</div>
        <div class="bottom-bar">
          <span class="pill">Auto-Action</span>
        </div>
      </div>
    </div>

    <div class="stage">
      <h3>展开态（全量计划项 + 状态徽标 + 标注信息）</h3>
      <div class="plan-board is-expanded">
        <button class="plan-board__header">
          <span class="plan-board__mark">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
              <path d="M4 5H10V11H4V5Z M4 13H10V19H4V13Z M12 6H20V8H12V6Z M12 10H20V12H12V10Z M12 16H20V18H12V16Z M12 14H20V15H12V14Z" fill="currentColor" />
            </svg>
          </span>
          <span class="plan-board__title">任务计划</span>
          <span class="plan-board__counter">2<span class="plan-board__counter-sep">/</span>5</span>
          <span class="plan-board__current">
            <span class="plan-board__current-label">进行中：</span>遍历搜索结果列表并核对覆盖范围
          </span>
          <svg class="plan-board__chevron is-open" width="10" height="10" viewBox="0 0 24 24" fill="none">
            <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <div class="plan-board__track">
          <span class="plan-board__track-fill" style="width: 40%"></span>
        </div>
        <div class="plan-board__list">
          <div class="plan-item is-done">
            <span class="plan-item__badge is-done">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6 9 17l-5-5" />
              </svg>
            </span>
            <span class="plan-item__body">
              <span class="plan-item__line">
                <span class="plan-item__id">1.</span>
                <span class="plan-item__step">打开目标站点并确认搜索入口可见</span>
              </span>
              <span class="plan-item__message">首页顶部搜索框可见，XPath 已记录</span>
            </span>
          </div>
          <div class="plan-item is-done">
            <span class="plan-item__badge is-done">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6 9 17l-5-5" />
              </svg>
            </span>
            <span class="plan-item__body">
              <span class="plan-item__line">
                <span class="plan-item__id">2.</span>
                <span class="plan-item__step">输入关键词并发起搜索</span>
              </span>
              <span class="plan-item__message">结果区已加载，按钮文案为「搜索」</span>
            </span>
          </div>
          <div class="plan-item is-in_progress">
            <span class="plan-item__badge is-in_progress">
              <span class="plan-item__dot"></span>
            </span>
            <span class="plan-item__body">
              <span class="plan-item__line">
                <span class="plan-item__id">3.</span>
                <span class="plan-item__step">遍历搜索结果列表并核对覆盖范围</span>
              </span>
            </span>
          </div>
          <div class="plan-item is-pending">
            <span class="plan-item__badge is-pending"></span>
            <span class="plan-item__body">
              <span class="plan-item__line">
                <span class="plan-item__id">4.</span>
                <span class="plan-item__step">探明分页与去重终止条件</span>
              </span>
            </span>
          </div>
          <div class="plan-item is-failed">
            <span class="plan-item__badge is-failed">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6 6 18M6 6l12 12" />
              </svg>
            </span>
            <span class="plan-item__body">
              <span class="plan-item__line">
                <span class="plan-item__id">5.</span>
                <span class="plan-item__step">采集全部结果并导出</span>
              </span>
              <span class="plan-item__message">登录态失效，接口返回 401，需人工重新登录</span>
            </span>
          </div>
        </div>
      </div>
      <div class="input-container">
        <div class="message-input">在这里输入你的问题…</div>
        <div class="bottom-bar">
          <span class="pill">Auto-Action</span>
        </div>
      </div>
    </div>
  </body>
</html>
