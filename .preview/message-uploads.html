<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>上传文件元素区预览</title>
<link rel="stylesheet" href="../entrypoints/sidepanel/styles/global.css">
<link rel="stylesheet" href="../entrypoints/sidepanel/styles/app.css">
<style>
  /* 预览页仅用于视觉核对：复刻侧边栏列宽（380px） */
  body { margin: 0; padding: 24px; background: var(--bg-secondary, #f8fafc); }
  .preview-col { background: var(--bg-primary, #fff); border: 1px solid var(--line-soft, #e4e2de); border-radius: 12px; padding: 12px; width: 380px; }
  .preview-label { font-size: 11px; color: var(--ink-secondary, #787671); margin-bottom: 8px; }
  .preview-bubble { margin-bottom: 10px; padding: 8px 12px; border-radius: 12px; background: var(--surface-soft, #f3f1ed); font-size: 13px; line-height: 1.5; }
/* ==================== 消息内上传文件元素区（MessageUploads） ====================
   用户消息气泡下方的文件元素列表：缩略图（图片）/ 文件图标 / 名称 + 体积 /
   动作按钮（网页预览 / 下载）。与消息关联图片区（message-images.css）同一套
   视觉语言：淡描边 + 半透明底 + 紧凑圆角。 */

.message-uploads {
  margin-top: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* ── 区块标签 ── */
.message-uploads-label {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--text-secondary, #64748b);
  font-size: 11px;
  line-height: 1.5;
}

/* ── 文件列表 ── */
.message-uploads-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.upload-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 8px;
  border: 1px solid rgba(148, 163, 184, 0.28);
  border-radius: 8px;
  background: rgba(148, 163, 184, 0.08);
  transition: border-color 0.15s ease, background 0.15s ease;
}

.upload-item:hover {
  border-color: rgba(148, 163, 184, 0.45);
  background: rgba(148, 163, 184, 0.14);
}

/* ── 图片缩略图 ── */
.upload-thumb {
  flex: 0 0 auto;
  position: relative;
  width: 40px;
  height: 40px;
  padding: 0;
  overflow: hidden;
  border: 1px solid rgba(148, 163, 184, 0.35);
  border-radius: 6px;
  background: rgba(148, 163, 184, 0.12);
  cursor: pointer;
  transition: border-color 0.15s ease, transform 0.15s ease;
}

.upload-thumb:hover {
  border-color: #6366f1;
  transform: translateY(-1px);
}

.upload-thumb:focus-visible {
  outline: 2px solid #6366f1;
  outline-offset: 1px;
}

.upload-thumb img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.upload-thumb-missing {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  color: #94a3b8;
  font-size: 14px;
  font-weight: 700;
}

/* ── 通用文件图标 ── */
.upload-icon {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: rgba(148, 163, 184, 0.16);
  color: #64748b;
}

/* ── 名称与体积 ── */
.upload-info {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.upload-name {
  overflow: hidden;
  color: inherit;
  font-size: 12px;
  line-height: 1.4;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.upload-size {
  color: var(--text-secondary, #64748b);
  font-size: 10px;
  line-height: 1.4;
  font-variant-numeric: tabular-nums;
}

/* ── 动作按钮 ── */
.upload-action {
  flex: 0 0 auto;
  padding: 3px 8px;
  border: 1px solid rgba(148, 163, 184, 0.35);
  border-radius: 6px;
  background: rgba(148, 163, 184, 0.1);
  color: inherit;
  font-size: 11px;
  line-height: 1.5;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.upload-action:hover {
  background: rgba(148, 163, 184, 0.22);
  border-color: rgba(148, 163, 184, 0.55);
}

.upload-action:focus-visible {
  outline: 2px solid #6366f1;
  outline-offset: 1px;
}

/* ── 瞬时失败提示 ── */
.upload-notice {
  margin: 2px 0 0;
  color: #b3564e;
  font-size: 11px;
  line-height: 1.5;
}

</style>
</head>
<body>
  <div class="preview-col">
    <div class="preview-label">用户消息气泡下方：全部上传文件元素</div>
    <div class="preview-bubble">帮我按照这个简历去投两个 ai agent 应用相关的实习生岗位</div>

    <div class="message-uploads">
      <div class="message-uploads-label">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M13,9V3.5L18.5,9H13Z" fill="currentColor"/>
        </svg>
        <span>本轮上传（4）</span>
      </div>

      <ul class="message-uploads-list">
        <li class="upload-item">
          <button type="button" class="upload-thumb" title="在网页中打开">
            <img src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22120%22%20height%3D%22120%22%3E%0A%20%20%20%20%3Crect%20width%3D%22120%22%20height%3D%22120%22%20fill%3D%22%23e8eaed%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M18%2084%20L46%2052%20L66%2074%20L80%2060%20L102%2084%20Z%22%20fill%3D%22%239aa4b2%22%2F%3E%0A%20%20%20%20%3Ccircle%20cx%3D%2242%22%20cy%3D%2236%22%20r%3D%229%22%20fill%3D%22%23c3cad4%22%2F%3E%0A%20%20%3C%2Fsvg%3E" alt="简历照片.png" loading="lazy">
          </button>
          <span class="upload-info">
            <span class="upload-name" title="inputs/简历照片.png">简历照片.png</span>
            <span class="upload-size">248.6 KB</span>
          </span>
        </li>

        <li class="upload-item">
          <span class="upload-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 3h8l4 4v14H6z M14 3v5h4 M12 10v7m-3-3 3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="upload-info">
            <span class="upload-name" title="inputs/岗位说明.pdf">岗位说明.pdf</span>
            <span class="upload-size">1.2 MB</span>
          </span>
          <button type="button" class="upload-action" title="网页预览">网页预览</button>
        </li>

        <li class="upload-item">
          <span class="upload-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 3h8l4 4v14H6z M14 3v5h4 M12 10v7m-3-3 3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="upload-info">
            <span class="upload-name" title="inputs/投递清单.csv">投递清单.csv</span>
            <span class="upload-size">4.0 KB</span>
          </span>
          <button type="button" class="upload-action" title="下载">下载</button>
        </li>

        <li class="upload-item">
          <span class="upload-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 3h8l4 4v14H6z M14 3v5h4 M12 10v7m-3-3 3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="upload-info">
            <span class="upload-name" title="inputs/项目作品集.html">项目作品集.html</span>
            <span class="upload-size">18.7 KB</span>
          </span>
          <button type="button" class="upload-action" title="网页预览">网页预览</button>
        </li>
      </ul>
    </div>
  </div>
</body>
</html>
