<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>流式增量冻结渲染预览</title>
    <link rel="stylesheet" href="../entrypoints/sidepanel/styles/global.css" />
    <link rel="stylesheet" href="../entrypoints/sidepanel/styles/app.css" />
    <link rel="stylesheet" href="../entrypoints/sidepanel/components/chat/chat-message-list.css" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #f4f5f7;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
      .note {
        font-size: 12px;
        color: #6b7280;
        max-width: 400px;
        line-height: 1.6;
      }
      .stage {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 16px;
        width: 400px;
        font-size: 14px;
        color: #292824;
      }
    </style>
  </head>
  <body>
    <p class="note">
      直播流模拟：图表围栏在流中闭合的瞬间即挂载（无需等回答结束）；后续 token
      只重写活动尾部，已挂载图表不被销毁；流结束终排冻结全部内容。
    </p>
    <main id="stream-host" class="stage message-content"></main>
    <script src="../node_modules/.cache/streaming-preview.js"></script>
  </body>
</html>
