<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Mermaid Offscreen</title>
</head>
<body>
  <!--
    此页面作为 Offscreen Document 运行，职责：
      1. 懒加载内置打包的 mermaid 库（不依赖任何 CDN 远程脚本）
      2. 将 mermaid_renderer 工具提交的源码渲染为 SVG 并转换为 PNG dataURL
      3. 通过 chrome.runtime.onMessage 响应 background / sidepanel 的渲染请求

    注意：此页面不可见，无 UI，仅用于突破 Service Worker 无 DOM/Canvas 的限制
    （Chrome Offscreen BLOBS reason）。生命周期由 mermaid-renderer 工具管理：
    每次渲染前 ensure、渲染后关闭（Chrome 全局仅允许一个 offscreen document，
    及时释放可避免与 screen-share-offscreen 互相冲突）。
  -->
  <script src="./main.ts" type="module"></script>
</body>
</html>
