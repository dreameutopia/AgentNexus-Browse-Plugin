<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>麦克风权限指南</title>
  <link rel="icon" href="/icon/48.png">
  <link rel="stylesheet" href="./style.css">
  <style>
    /* 关键内联样式：JS（i18n 注入）就绪前隐藏正文并显示加载遮罩，
       避免先闪现未本地化的原始页面。main.ts 给 <html> 加 app-ready 后揭开。 */
    html:not(.app-ready) .guide-container { visibility: hidden; }

    .app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f7f7f8;
      transition: opacity 0.25s ease;
    }

    html.app-ready .app-loading { opacity: 0; pointer-events: none; }

    html.app-ready .guide-container {
      visibility: visible;
      animation: app-fade-in 0.3s ease both;
    }

    .app-loading__spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e4e6ea;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: app-spin 0.8s linear infinite;
    }

    @keyframes app-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes app-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-loading__spinner { animation: none; }
      html.app-ready .guide-container { animation: none; }
    }
  </style>
</head>
<body>
  <!-- 加载遮罩：main.ts 完成 i18n 注入后淡出并从 DOM 移除 -->
  <div id="app-loading" class="app-loading" aria-hidden="true">
    <div class="app-loading__spinner"></div>
  </div>
  <div class="guide-container">
    <header class="header">
      <div class="brand">
        <img class="brand-logo" src="/logo.png" alt="" width="30" height="30">
        <span class="brand-name">AgentNexus</span>
      </div>
      <h1 class="main-title" data-i18n="permission.pageTitle">麦克风权限指南</h1>
      <p class="subtitle" data-i18n="permission.pageSubtitle">启用语音转文字需要麦克风权限。如果授权没有自动弹出，按下面的步骤手动开启。</p>
      <!-- 状态胶囊：仅授权流程（?reason=mic-permission）打开时由 main.ts 显示 -->
      <div class="status" id="status" data-state="requesting" role="status">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="status-text"></span>
      </div>
    </header>

    <ol class="steps">
      <li class="step">
        <span class="step-num" aria-hidden="true">1</span>
        <div class="step-body">
          <div class="step-content">
            <h2 class="step-title" data-i18n="permission.step1Title">如果您看到弹出窗口</h2>
            <p class="step-description" data-i18n="permission.step1Desc">点击"访问该网站时允许"以启用语音转文字功能。</p>
          </div>
        </div>
      </li>

      <li class="step">
        <span class="step-num" aria-hidden="true">2</span>
        <div class="step-body">
          <div class="step-content">
            <h2 class="step-title" data-i18n="permission.step2Title">如果没有弹出窗口</h2>
            <p class="step-description" data-i18n="permission.step2Desc">之前选择过“阻止”时，Chrome 不会再次弹窗。打开下方设置，移除对本扩展的限制后刷新本页；若列表中没有本扩展，直接刷新即可。</p>
            <button type="button" class="step-action" id="open-mic-settings" data-i18n="permission.openMicSettings">打开麦克风设置</button>
          </div>
        </div>
      </li>

      <li class="step">
        <span class="step-num" aria-hidden="true">3</span>
        <div class="step-body">
          <div class="step-content">
            <h2 class="step-title" data-i18n="permission.step3Title">如果仍然无法授权</h2>
            <p class="step-description" data-i18n="permission.step3Desc">刷新页面，然后点击地址栏中的🔒图标，选择"始终允许"。</p>
          </div>
        </div>
      </li>
    </ol>

    <footer class="footer">
      <img class="footer-logo" src="/logo.png" alt="" width="18" height="18">
      <span class="footer-name">AgentNexus</span>
    </footer>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
