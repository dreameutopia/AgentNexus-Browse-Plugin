<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>麦克风权限指南</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    /* 关键内联样式：JS（i18n 注入）就绪前隐藏正文并显示加载遮罩，
       避免先闪现未本地化的原始页面。main.ts 给 <html> 加 app-ready 后揭开。 */
    html:not(.app-ready) .guide-container { visibility: hidden; }

    .app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f8fafc;
      transition: opacity 0.25s ease;
    }

    html.app-ready .app-loading { opacity: 0; pointer-events: none; }

    html.app-ready .guide-container {
      visibility: visible;
      animation: app-fade-in 0.3s ease both;
    }

    .app-loading__spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: app-spin 0.8s linear infinite;
    }

    @keyframes app-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes app-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-loading__spinner { animation: none; }
      html.app-ready .guide-container { animation: none; }
    }
  </style>
</head>
<body>
  <!-- 加载遮罩：main.ts 完成 i18n 注入后淡出并从 DOM 移除 -->
  <div id="app-loading" class="app-loading" aria-hidden="true">
    <div class="app-loading__spinner"></div>
  </div>
  <div class="guide-container">
    <div class="header">
      <div class="logo">
        <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C13.1 2 14 2.9 14 4V12C14 13.1 13.1 14 12 14C10.9 14 10 13.1 10 12V4C10 2.9 10.9 2 12 2ZM19 10V12C19 15.9 15.9 19 12 19C8.1 19 5 15.9 5 12V10H7V12C7 14.8 9.2 17 12 17C14.8 17 17 14.8 17 12V10H19ZM10 21H14V23H10V21Z"/>
        </svg>
        <span class="logo-text">AgentNexus</span>
      </div>
      <h1 class="main-title" data-i18n="permission.pageTitle">麦克风权限指南</h1>
    </div>

    <div class="status" style="text-align:center; margin:-12px 0 16px 0; color:#64748b;">
      <span id="status-text"></span>
    </div>

    <div class="steps-container">
      <div class="step-card">
        <div class="step-image">
          <img src="/tip/voice-1.png" alt="如果您看到弹出窗口">
        </div>
        <div class="step-content">
          <h3 class="step-title" data-i18n="permission.step1Title">如果您看到弹出窗口</h3>
          <p class="step-description" data-i18n="permission.step1Desc">点击"访问该网站时允许"以启用语音转文字功能。</p>
        </div>
      </div>

      <div class="step-card">
        <div class="step-image">
          <img src="/tip/voice-2.png" alt="如果没有弹出窗口">
        </div>
        <div class="step-content">
          <h3 class="step-title" data-i18n="permission.step2Title">如果没有弹出窗口</h3>
          <p class="step-description" data-i18n="permission.step2Desc">点击地址栏中的麦克风图标，选择"始终允许"并点击"完成"。</p>
        </div>
      </div>

      <div class="step-card">
        <div class="step-image">
          <img src="/tip/voice-3.png" alt="如果您没有看到麦克风图标">
        </div>
        <div class="step-content">
          <h3 class="step-title" data-i18n="permission.step3Title">如果您没有看到麦克风图标</h3>
          <p class="step-description" data-i18n="permission.step3Desc">刷新页面，然后点击地址栏中的🔒图标，选择"始终允许"。</p>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="footer-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C13.1 2 14 2.9 14 4V12C14 13.1 13.1 14 12 14C10.9 14 10 13.1 10 12V4C10 2.9 10.9 2 12 2ZM19 10V12C19 15.9 15.9 19 12 19C8.1 19 5 15.9 5 12V10H7V12C7 14.8 9.2 17 12 17C14.8 17 17 14.8 17 12V10H19ZM10 21H14V23H10V21Z"/>
        </svg>
        <span>Sider</span>
      </div>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
